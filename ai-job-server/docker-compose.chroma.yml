# RAG 5.5：Docker 部署 Chroma（解决 Windows 本机 ACCESS_VIOLATION）
# 启动：docker compose -f docker-compose.chroma.yml up -d
# 停止：docker compose -f docker-compose.chroma.yml down
# 数据卷：ai-job-chroma-data（容器重启后向量仍在）
#
# Spring Boot / LangChain4j：knowledge.chroma.base-url=http://127.0.0.1:8000

services:
  chroma:
    image: chromadb/chroma:1.0.0
    container_name: ai-job-chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: "/chroma/chroma"
    restart: unless-stopped

volumes:
  chroma_data:
    name: ai-job-chroma-data
