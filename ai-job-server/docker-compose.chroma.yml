# RAG 5.5 兼容入口：仅启动 Chroma
# 推荐改用仓库根目录统一基础设施：
#   docker compose up -d
# （MySQL + Redis + Chroma）
#
# 本文件保留给「只要向量库」的场景。

services:
  chroma:
    image: chromadb/chroma:1.0.0
    container_name: ai-job-chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: "/chroma/chroma"
    restart: unless-stopped

volumes:
  chroma_data:
    name: ai-job-chroma-data
