spring:
  application:
    name: ai-job-server

  threads:
    virtual:
      # 同步的简历分析、岗位匹配、面试开场和报告跑在 Tomcat 虚拟线程上。
      # SSE 发送仍用平台线程池，见 RestClientConfig。
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/ai_job_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mvc:
    async:
      request-timeout: 180000

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ai-job-platform-jwt-secret-key-2026-secure

file:
  upload-path: uploads/resumes
  knowledge-upload-path: uploads/knowledge

interview:
  redis:
    # 面试临时会话 TTL（秒），answer 时刷新
    session-ttl-seconds: 7200

# LangChain4j → DeepSeek（OpenAI 兼容协议）；Key 仅从环境变量读取
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      model-name: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.3
      timeout: PT60S
      # 连接失败时的额外重试次数，LangChain4j 内部指数退避。不含已开始输出的流式调用。
      max-retries: 3
      log-requests: false
      log-responses: false
    # RAG 5.9：流式 ChatModel（与同步 chat-model 共用 DeepSeek 配置）
    streaming-chat-model:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      model-name: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      temperature: 0.3
      timeout: PT120S
      # 流式只再试 1 次，避免连接中途失败后把已推给前端的 delta 整段重放。
      max-retries: 1
      log-requests: false
      log-responses: false

# Chroma：LangChain4j 通过 HTTP 访问 Docker 中的 Chroma（见 docker-compose.chroma.yml）
knowledge:
  chroma:
    base-url: ${CHROMA_BASE_URL:http://127.0.0.1:8000}
    collection-name: knowledge_chunks
    timeout-seconds: 60
  rag:
    # Top-K 检索条数（默认 5，允许请求覆盖，上限见 KnowledgeAskRequest）
    top-k: 5
    # 最低相关性分数（越大越相关）。Chroma HTTP 返回的是 cosine distance（越小越相似）；
    # LangChain4j ChromaEmbeddingStore 会转成 EmbeddingMatch.score ∈ [0,1]（越大越相关），
    # 本配置卡的是转换后的 score（score >= min-score 才保留）。换 Embedding 模型后需重标定。
    min-score: 0.2

# 指标在 /actuator/metrics（需登录）。没有 Collector 时不导出，避免启动去连 localhost:4318。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
