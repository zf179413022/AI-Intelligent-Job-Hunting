spring:
  application:
    name: ai-job-server

  datasource:
    url: jdbc:mysql://localhost:3306/ai_job_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    async:
      request-timeout: 180000

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ai-job-platform-jwt-secret-key-2026-secure

file:
  upload-path: uploads/resumes

interview:
  redis:
    # 面试临时会话 TTL（秒），answer 时刷新
    session-ttl-seconds: 7200
